name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITALINK_DATABASE_URL: postgresql+psycopg://vitallink:vitallink@localhost:5432/vitallink
      VITALINK_PUBLIC_ORIGIN: https://testserver
      VITALINK_SECRET_KEY: ci-only-synthetic-secret-key-with-32-characters
      VITALINK_S3_SECRET_KEY: ci-only-synthetic-storage-secret
      VITALINK_SMTP_HOST: localhost
      VITALINK_SMTP_PORT: 1025
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: VitaLink Health Management App/pnpm-lock.yaml

      - name: Start real integration services
        run: docker compose up -d --wait --wait-timeout 120 postgres mailpit minio clamav

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Verify idempotent synthetic seed
        env:
          VITALINK_DEMO_PASSWORD: synthetic-demo-password-only
          VITALINK_DEMO_TOTP_SECRET: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
        run: |
          uv run python -m vitallink.seed_demo
          uv run python -m vitallink.seed_demo

      - name: Check backend
        run: |
          uv run ruff format --check src tests migrations
          uv run ruff check src tests migrations
          uv run pip-audit
          uv run pytest

      - name: Install frontend dependencies
        working-directory: VitaLink Health Management App
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        working-directory: VitaLink Health Management App
        run: |
          pnpm format:check
          pnpm audit --prod --audit-level high
          pnpm test
          pnpm build

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color postgres mailpit minio clamav
